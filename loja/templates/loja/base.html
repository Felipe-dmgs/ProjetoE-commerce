{% load static %}
<!--
    base.html
    ---------
    Template "pai": define a estrutura comum a todas as páginas (menu, rodapé,
    inclusão do Bootstrap).
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mini E-commerce{% endblock %}</title>

    <!-- Bootstrap via CDN: não precisamos instalar nada localmente -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'loja/css/estilos.css' %}">
</head>
<body>

<!-- Barra de navegação simples -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'loja:lista_produtos' %}">Mini E-commerce</a>
        <div class="d-flex">
            <a href="{% url 'loja:ver_carrinho' %}" class="btn btn-outline-light">
                Carrinho
            </a>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Mensagens do Django (sucesso, erro, aviso) aparecem aqui automaticamente -->
    {% if messages %}
        {% for mensagem in messages %}
            <div class="alert alert-{{ mensagem.tags }} alert-dismissible fade show" role="alert">
                {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block conteudo %}
    {% endblock %}

</div>

<!-- JS do Bootstrap (necessário para os alerts fecharem, dropdowns, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'loja/js/carrinho.js' %}"></script>
</body>
</html>
