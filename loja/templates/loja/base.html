{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mini E-commerce{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'loja/css/estilos.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'loja:lista_produtos' %}">Mini E-commerce</a>
        <div class="d-flex">
            <a href="{% url 'loja:ver_carrinho' %}" class="btn btn-outline-light">
                Carrinho
            </a>
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for mensagem in messages %}
            <div class="alert alert-{{ mensagem.tags }} alert-dismissible fade show" role="alert">
                {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block conteudo %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'loja/js/carrinho.js' %}"></script>
</body>
</html>
